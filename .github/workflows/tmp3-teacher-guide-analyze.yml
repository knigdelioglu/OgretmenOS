name: TMP3 Teacher Guide Analyze

on:
  push:
    branches:
      - fix/teacher-guide-note-state
    paths:
      - .github/workflows/tmp3-teacher-guide-analyze.yml

permissions:
  contents: write

jobs:
  analyze-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 tool/tmp_teacher_guide_note_fix.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/resources/teacher_guide_viewer_page.dart test/teacher_guide_viewer_test.dart
      - name: Capture analyzer output and patched tree
        shell: bash
        run: |
          set +e
          flutter analyze > teacher-guide-analyze.log 2>&1
          status=$?
          set -e
          cat teacher-guide-analyze.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            teacher-guide-analyze.log \
            lib/features/resources/teacher_guide_viewer_page.dart \
            test/teacher_guide_viewer_test.dart \
            tool/rebuild_curriculum_only_runtimes.py \
            .github/workflows/flutter-ci.yml \
            tymm-verileri/turk-dili-ve-edebiyati/TDE_11/package_manifest.json
          git commit -m 'wip: capture teacher guide analyzer failure'
          git push origin HEAD:fix/teacher-guide-note-state
          exit "$status"
