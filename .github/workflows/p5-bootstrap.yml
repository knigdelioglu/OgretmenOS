name: P5 Bootstrap

on:
  push:
    branches:
      - feat/lesson-plan-progress-p5
    paths:
      - tool/p5_patch_large_files.py
      - .github/workflows/p5-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/lesson-plan-progress-p5
      - name: Patch large files
        run: python tool/p5_patch_large_files.py
      - name: Remove bootstrap files
        run: rm tool/p5_patch_large_files.py .github/workflows/p5-bootstrap.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(p5): wire lesson plan progress into weekly view"
          git push origin HEAD:feat/lesson-plan-progress-p5
