name: Temporary Android Release Publisher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore: publish current Android release'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create ephemeral release key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ogretmenos-release.jks" \
            -storepass release-password \
            -keypass release-password \
            -alias ogretmenos-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=OgretmenOS Release, OU=Release, O=OgretmenOS, L=CI, ST=CI, C=TR"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/ogretmenos-release.jks
          storePassword=release-password
          keyAlias=ogretmenos-release
          keyPassword=release-password
          EOF

      - name: Build current Android APK
        run: flutter build apk --release --no-pub

      - name: Publish or update v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 74e6f072f8a99e57d96925f9ae8271501b2658f3
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          APK="OgretmenOS-v1.0.0-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          cat > release-notes.md <<EOF
          # ÖğretmenOS v1.0.0

          Güncel Android paketi.

          - Türk Dili ve Edebiyatı 9. sınıf: tam runtime
          - Türk Dili ve Edebiyatı 10. sınıf: tam runtime
          - Türk Dili ve Edebiyatı 11. sınıf: öğretim programı hazır, ders kitabı bekleniyor
          - Türk Dili ve Edebiyatı 12. sınıf: öğretim programı hazır, ders kitabı bekleniyor
          - 9-12 için haftalık/yıllık plan desteği
          - Kaynak commit: ${TARGET_SHA}
          - APK SHA-256: ${SHA256}

          Not: Bu APK mevcut CI düzenindeki geçici Android imzalama anahtarıyla imzalanmıştır.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "ÖğretmenOS v1.0.0" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "$APK" \
              --target "$TARGET_SHA" \
              --title "ÖğretmenOS v1.0.0" \
              --notes-file release-notes.md \
              --latest
          fi

          gh release view "$TAG" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'

      - name: Record successful publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'v1.0.0\nOgretmenOS-v1.0.0-android.apk\n74e6f072f8a99e57d96925f9ae8271501b2658f3\n' > .release-published
          git add .release-published
          git commit -m 'chore: record Android release publication [skip ci]'
          git push origin HEAD:main
