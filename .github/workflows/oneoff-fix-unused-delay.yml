name: One-off CI lint fix

on:
  push:
    branches: [automation/fix-ci-unused-delay]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Remove obsolete delay helper branch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/tab_loading_regression_test.dart')
          text = path.read_text()

          replacements = {
              "    this.delay,\n": "",
              "  final Duration? delay;\n": "",
              "    final delay = this.delay;\n    if (delay != null) {\n      return Future<AnnualOutcomePlan>.delayed(delay, () => plan);\n    }\n": "",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected snippet missing: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit source-only fix and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+knigdelioglu@users.noreply.github.com'
          git rm .github/workflows/oneoff-fix-unused-delay.yml
          git add test/tab_loading_regression_test.dart
          git diff --cached --check
          git commit -m 'fix(test): remove unused delay helper'
          git push origin HEAD:${GITHUB_REF_NAME}
