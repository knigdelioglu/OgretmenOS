name: ADHD Phase 6 Course Scope Fix

on:
  push:
    branches:
      - ux/adhd-phase-6-progress-semantics
    paths:
      - .github/workflows/adhd-phase6-course-scope-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/adhd-phase-6-progress-semantics

      - name: Scope annual tracking summary to active course
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/annual_plan/annual_plan_page.dart')
          text = path.read_text()
          old = '''  Future<_OptionalTrackingSummary?> _loadTrackingSummary() async {
    final service = widget.outcomePlanning;
    if (service == null) return null;
    try {
      final weeklyPlan = await service.weeklyPlanning.buildPlan();
      final records = await service.trackingRepository.getForAcademicYear(
        weeklyPlan.academicYear,
      );
      final summary = _OptionalTrackingSummary.fromRecords(records);
      return summary.hasExplicitStatus ? summary : null;
    } on Object {
      // Optional tracking summary must never block the annual lesson sequence.
      return null;
    }
  }
'''
          new = '''  Future<_OptionalTrackingSummary?> _loadTrackingSummary() async {
    final service = widget.outcomePlanning;
    if (service == null) return null;
    try {
      final plan = await service.buildPlan();
      final courseTrackingKeys = <String>{
        for (final week in plan.weeks)
          for (final item in week.outcomes) item.trackingKey,
      };
      final records = await service.trackingRepository.getForAcademicYear(
        plan.academicYear,
      );
      final scopedRecords = records.where(
        (record) => courseTrackingKeys.contains(
          '${record.academicYear}:${record.outcomeId}:${record.plannedWeekNumber}',
        ),
      );
      final summary = _OptionalTrackingSummary.fromRecords(scopedRecords);
      return summary.hasExplicitStatus ? summary : null;
    } on Object {
      // Optional tracking summary must never block the annual lesson sequence.
      return null;
    }
  }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one tracking helper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/features/annual_plan/annual_plan_page.dart

      - name: Test annual and phase 6 contracts
        run: flutter test test/widget_test.dart test/continuity_test.dart test/responsive_accessibility_test.dart --reporter expanded

      - name: Analyze
        run: flutter analyze lib/features/annual_plan/annual_plan_page.dart

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/adhd-phase6-course-scope-fix.yml
          git checkout -- analysis_options.yaml pubspec.lock || true

      - name: Commit scoped fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(ux): scope optional tracking summary to active course"
          git push origin HEAD:ux/adhd-phase-6-progress-semantics
