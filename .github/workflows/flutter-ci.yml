name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install app dependencies
        run: flutter pub get

      - name: Install runtime verifier dependencies
        working-directory: tool/runtime_verifier
        run: dart pub get

      - name: Analyze app
        run: flutter analyze

      - name: Analyze runtime verifier
        working-directory: tool/runtime_verifier
        run: dart analyze

  runtime-contract:
    name: Runtime Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install runtime verifier dependencies
        working-directory: tool/runtime_verifier
        run: dart pub get

      - name: Verify versioned canonical runtime
        working-directory: tool/runtime_verifier
        run: dart run bin/verify_runtime.dart

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Run tests against versioned runtime
        run: flutter test --reporter expanded

  android-release:
    name: Android Release Build
    needs: [analyze, runtime-contract, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Create ephemeral CI release key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ogretmenos-ci-release.jks" \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias ogretmenos-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=OgretmenOS CI, OU=CI, O=OgretmenOS, L=CI, ST=CI, C=TR"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/ogretmenos-ci-release.jks
          storePassword=ci-release-password
          keyAlias=ogretmenos-ci
          keyPassword=ci-release-password
          EOF

      - name: Build Android release APK with versioned runtime
        run: flutter build apk --release --no-pub
