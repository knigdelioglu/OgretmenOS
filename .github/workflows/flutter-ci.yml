name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate curriculum runtime Python tools
        run: |
          python3 -m py_compile \
            tool/process_component_resolver.py \
            tool/build_curriculum_only_runtime.py \
            tool/rebuild_curriculum_only_runtimes.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install app dependencies
        run: flutter pub get

      - name: Install runtime verifier dependencies
        working-directory: tool/runtime_verifier
        run: dart pub get

      - name: Analyze app
        run: flutter analyze

      - name: Analyze runtime verifier
        working-directory: tool/runtime_verifier
        run: dart analyze

  runtime-contract:
    name: Runtime Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rebuild TDE11/TDE12 curriculum-only runtimes
        run: python3 tool/rebuild_curriculum_only_runtimes.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install runtime verifier dependencies
        working-directory: tool/runtime_verifier
        run: dart pub get

      - name: Verify TDE9 full runtime
        working-directory: tool/runtime_verifier
        run: dart run bin/verify_runtime.dart --course TDE_9

      - name: Verify TDE10 full runtime
        working-directory: tool/runtime_verifier
        run: dart run bin/verify_runtime.dart --course TDE_10

      - name: Verify TDE11 curriculum-only runtime
        working-directory: tool/runtime_verifier
        run: dart run bin/verify_runtime.dart --course TDE_11

      - name: Verify TDE12 curriculum-only runtime
        working-directory: tool/runtime_verifier
        run: dart run bin/verify_runtime.dart --course TDE_12

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rebuild TDE11/TDE12 curriculum-only runtimes
        run: python3 tool/rebuild_curriculum_only_runtimes.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Run tests against versioned TYMM packages
        run: flutter test --reporter expanded

  android-release:
    name: Android Release Build
    needs: [analyze, runtime-contract, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rebuild TDE11/TDE12 curriculum-only runtimes
        run: python3 tool/rebuild_curriculum_only_runtimes.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Create ephemeral CI release key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ogretmenos-ci-release.jks" \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias ogretmenos-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=OgretmenOS CI, OU=CI, O=OgretmenOS, L=CI, ST=CI, C=TR"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/ogretmenos-ci-release.jks
          storePassword=ci-release-password
          keyAlias=ogretmenos-ci
          keyPassword=ci-release-password
          EOF

      - name: Build Android release APK with four TYMM packages
        run: flutter build apk --release --no-pub

      - name: Verify runtime assets inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          LIST="$RUNNER_TEMP/apk-files.txt"
          unzip -l "$APK" > "$LIST"
          for course in TDE_9 TDE_10 TDE_11 TDE_12; do
            base="assets/flutter_assets/tymm-verileri/turk-dili-ve-edebiyati/$course/runtime"
            grep -F "$base/runtime_manifest.json" "$LIST"
            grep -F "$base/course_runtime.sqlite" "$LIST"
          done

      - name: Publish verified APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          VERSION="${VERSION%%+*}"
          TAG="v${VERSION}"
          ASSET="OgretmenOS-${VERSION}-android.apk"
          DEST="$RUNNER_TEMP/$ASSET"
          cp "$APK" "$DEST"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEST" --clobber
          else
            gh release create "$TAG" "$DEST" \
              --target "$GITHUB_SHA" \
              --title "ÖğretmenOS $TAG" \
              --generate-notes
          fi

          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"

  publish-curriculum-runtimes:
    name: Publish Curriculum Runtimes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Rebuild TDE11/TDE12 curriculum-only runtimes
        run: python3 tool/rebuild_curriculum_only_runtimes.py

      - name: Publish fresh runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tymm-verileri/turk-dili-ve-edebiyati/TDE_11/runtime \
            tymm-verileri/turk-dili-ve-edebiyati/TDE_12/runtime
          if git diff --cached --quiet; then
            echo 'Curriculum-only runtime assets are already fresh.'
            exit 0
          fi
          git commit -m 'chore: publish inheritance-aware curriculum runtimes'
          git fetch origin main
          CHANGED=$(git diff --name-only "$GITHUB_SHA"..origin/main || true)
          if printf '%s\n' "$CHANGED" | grep -Eq '^(tool/(process_component_resolver|build_curriculum_only_runtime|rebuild_curriculum_only_runtimes)\.py|tymm-verileri/turk-dili-ve-edebiyati/(TDE_SHARED/|TDE_(11|12)/(curriculum/|package_manifest\.json))|test/tymm_four_course_packages_test\.dart|\.github/workflows/flutter-ci\.yml$)'; then
            echo 'A newer curriculum runtime dependency exists; refusing stale publish.'
            exit 0
          fi
          git reset --hard HEAD
          git rebase origin/main
          python3 tool/rebuild_curriculum_only_runtimes.py
          git add \
            tymm-verileri/turk-dili-ve-edebiyati/TDE_11/runtime \
            tymm-verileri/turk-dili-ve-edebiyati/TDE_12/runtime
          git commit --amend --no-edit
          git push origin HEAD:main
