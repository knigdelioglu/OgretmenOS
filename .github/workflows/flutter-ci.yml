name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare CI-only generated asset placeholders
        shell: bash
        run: |
          mkdir -p assets/courses/TDE_9
          printf '%s\n' '{"ci_placeholder":true}' > assets/courses/TDE_9/runtime_manifest.json
          printf 'CI_PLACEHOLDER_ONLY\n' > assets/courses/TDE_9/course_runtime.sqlite

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded
