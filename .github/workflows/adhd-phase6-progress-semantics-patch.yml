name: ADHD Phase 6 Progress Semantics Patch

on:
  push:
    branches:
      - ux/adhd-phase-6-progress-semantics
    paths:
      - tool/apply_adhd_phase6_progress_semantics.py
      - .github/workflows/adhd-phase6-progress-semantics-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/adhd-phase-6-progress-semantics

      - name: Apply phase 6 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/apply_adhd_phase6_progress_semantics.py')
          text = path.read_text()
          text = text.replace(
              "List<T> _uniqueBy<T>(Iterable<T> items, String Function(T item) keyOf) {\\n",
              "List<T> _uniqueBy<T>(Iterable<T> items, String Function(T item) idOf) {\\n",
          )
          path.write_text(text)
          PY
          python3 tool/apply_adhd_phase6_progress_semantics.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/outcomes/outcome_detail_page.dart')
          text = path.read_text().replace(
              "OutcomeTrackingStatus.planned => 'Planlı durumuna döndürüldü.',",
              "OutcomeTrackingStatus.planned => 'Takip durumu temizlendi.',",
          )
          path.write_text(text)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/app/app.dart lib/features/annual_plan/annual_plan_page.dart lib/features/this_week/this_week_page.dart lib/features/outcomes/outcome_detail_page.dart test/widget_test.dart

      - name: Run phase 6 and regression tests
        run: flutter test test/widget_test.dart test/adhd_phase0_ux_test.dart test/adhd_phase1_action_density_test.dart test/adhd_phase2_continuity_test.dart test/responsive_accessibility_test.dart --reporter expanded

      - name: Analyze changed code
        run: flutter analyze lib/app/app.dart lib/features/annual_plan/annual_plan_page.dart lib/features/this_week/this_week_page.dart lib/features/outcomes/outcome_detail_page.dart test/widget_test.dart

      - name: Remove temporary patch machinery
        run: |
          rm -f tool/apply_adhd_phase6_progress_semantics.py
          rm -f .github/workflows/adhd-phase6-progress-semantics-patch.yml
          git checkout -- analysis_options.yaml pubspec.lock || true

      - name: Commit phase 6 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(ux): separate lesson position from optional tracking"
          git push origin HEAD:ux/adhd-phase-6-progress-semantics
