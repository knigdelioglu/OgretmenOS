name: Temporary TYMM Data Importer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'feat/tymm-verileri-curriculum-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/tymm-verileri-curriculum-only
          fetch-depth: 0

      - name: Import pinned TYMM packages
        shell: bash
        run: |
          set -euo pipefail
          SHA=a0389a83c62102fe9be082b887737638afe23b69
          BASE="https://raw.githubusercontent.com/knigdelioglu/tymm/$SHA/courses"
          ROOT="tymm-verileri/turk-dili-ve-edebiyati"

          for COURSE in TDE_9 TDE_10; do
            mkdir -p "$ROOT/$COURSE/runtime"
            curl -fL "$BASE/$COURSE/runtime/course_runtime.sqlite" -o "$ROOT/$COURSE/runtime/course_runtime.sqlite"
            curl -fL "$BASE/$COURSE/runtime/runtime_manifest.json" -o "$ROOT/$COURSE/runtime/runtime_manifest.json"
            curl -fL "$BASE/$COURSE/runtime/runtime_validation_report.md" -o "$ROOT/$COURSE/runtime/runtime_validation_report.md"
          done

          for COURSE in TDE_11 TDE_12; do
            mkdir -p "$ROOT/$COURSE/curriculum"
            curl -fL "$BASE/$COURSE/curriculum_map.json" -o "$ROOT/$COURSE/curriculum/curriculum_map.json"
            curl -fL "$BASE/$COURSE/source_manifest.json" -o "$ROOT/$COURSE/curriculum/source_manifest.json"
            curl -fL "$BASE/$COURSE/curriculum_validation_report.json" -o "$ROOT/$COURSE/curriculum/curriculum_validation_report.json"
            python tool/build_curriculum_only_runtime.py \
              --package-root "$ROOT/$COURSE" \
              --source-commit "$SHA"
          done

          rm -rf assets/courses/TDE_9 assets/courses/TDE_10

      - name: Validate imported package shape
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root = Path('tymm-verileri/turk-dili-ve-edebiyati')
          for course in ('TDE_9','TDE_10','TDE_11','TDE_12'):
              package = json.loads((root/course/'package_manifest.json').read_text())
              runtime = json.loads((root/course/'runtime/runtime_manifest.json').read_text())
              assert package['course_id'] == course
              assert runtime['course_id'] == course
              db = sqlite3.connect(root/course/'runtime/course_runtime.sqlite')
              try:
                  db_course = db.execute('select course_id from courses').fetchone()[0]
                  assert db_course == course
              finally:
                  db.close()
          for course in ('TDE_11','TDE_12'):
              runtime = json.loads((root/course/'runtime/runtime_manifest.json').read_text())
              assert runtime['data_mode'] == 'CURRICULUM_ONLY'
              assert runtime['row_counts']['themes'] == 4
              assert runtime['row_counts']['blocks'] == 16
              assert runtime['row_counts']['outcomes'] == 64
          print('TYMM_DATA_IMPORT: PASS')
          PY

      - name: Publish imported data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tymm-verileri assets/courses
          if git diff --cached --quiet; then
            echo 'No imported-data changes to publish.'
          else
            git commit -m 'feat: import four TYMM course data packages'
            git push origin HEAD:feat/tymm-verileri-curriculum-only
          fi
