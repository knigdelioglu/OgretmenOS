name: ADHD Phase 1 Patch

on:
  push:
    branches:
      - "ux/adhd-phase-1"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/adhd-phase-1
          fetch-depth: 0

      - name: Reduce competing actions
        run: python3 tool/apply_adhd_phase1_patch.py

      - name: Commit phase 1 source changes
        run: |
          if git diff --quiet -- lib/features/this_week/this_week_page.dart lib/features/outcomes/outcome_detail_page.dart; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/this_week/this_week_page.dart lib/features/outcomes/outcome_detail_page.dart
          git commit -m "feat(ux): reduce competing teaching actions"
          git push origin HEAD:ux/adhd-phase-1
