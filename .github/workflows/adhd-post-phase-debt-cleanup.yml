name: ADHD Post-Phase Debt Cleanup

on:
  push:
    branches:
      - ux/adhd-post-phase-debt-cleanup
    paths:
      - tool/apply_adhd_post_phase_debt_cleanup.py
      - .github/workflows/adhd-post-phase-debt-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/adhd-post-phase-debt-cleanup

      - name: Apply audited debt cleanup
        run: python3 tool/apply_adhd_post_phase_debt_cleanup.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/data/preferences/continuity_repository.dart \
            lib/domain/models/outcome_tracking_models.dart \
            lib/domain/services/outcome_planning_service.dart \
            lib/features/annual_plan/annual_plan_page.dart \
            lib/features/this_week/continuity_this_week_page.dart \
            test/continuity_test.dart \
            test/adhd_phase5_annual_continuity_test.dart \
            test/tracking_identity_test.dart \
            test/product_contract_test.dart

      - name: Run focused cross-phase audit tests
        run: |
          flutter test \
            test/adhd_phase0_ux_test.dart \
            test/adhd_phase1_action_density_test.dart \
            test/continuity_test.dart \
            test/resource_library_focus_test.dart \
            test/adhd_phase5_annual_continuity_test.dart \
            test/tracking_identity_test.dart \
            test/product_contract_test.dart \
            test/widget_test.dart \
            test/responsive_accessibility_test.dart \
            --reporter expanded

      - name: Analyze full app after dead-code removal
        run: flutter analyze

      - name: Remove temporary patch machinery
        run: |
          rm -f tool/apply_adhd_post_phase_debt_cleanup.py
          rm -f .github/workflows/adhd-post-phase-debt-cleanup.yml
          git checkout -- analysis_options.yaml pubspec.lock || true

      - name: Commit audited cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(ux): close post-phase DEHB debts"
          git push origin HEAD:ux/adhd-post-phase-debt-cleanup
