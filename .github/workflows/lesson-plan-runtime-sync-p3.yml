name: Teacher Guide V2.2 Runtime Projection

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lesson-plan-runtime-sync-p3.yml'
      - 'tool/project_teacher_guide_pedagogy_v2.py'
      - 'tool/teacher_guide/teacher_guide_v2_profiles.json'
      - 'tool/runtime_verifier/**'
      - 'lib/domain/runtime/runtime_manifest_policy.dart'
      - 'lib/data/course/course_database_installer.dart'
      - 'lib/data/course/teacher_guide_database_data_source.dart'
      - 'lib/domain/models/teacher_guide_models.dart'
      - 'lib/features/resources/teacher_guide_viewer_page.dart'
      - 'test/**teacher_guide**'
      - 'test/runtime_manifest_policy_test.dart'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teacher-guide-v2-2-${{ github.ref }}
  cancel-in-progress: false

env:
  TDE11_RUNTIME: tymm-verileri/turk-dili-ve-edebiyati/TDE_11/runtime
  TDE11_PACKAGE: tymm-verileri/turk-dili-ve-edebiyati/TDE_11/package_manifest.json
  V22_PROFILE: tool/teacher_guide/teacher_guide_v2_profiles.json
  EXPECTED_CANONICAL_FINGERPRINT: 67507026f1019f3e014eec12e89c266a662723ead48cf92ca07539a66ca59a95
  EXPECTED_BASE_TEACHER_FINGERPRINT: c5ae313525bfd92cf43cf00ec9f3017966db1eb6bd7610f8f824ce85ac228f96
  TYMM_V22_COMMIT: dc12e50ccf2e2e27e7a4a1d06793a9b8c0fb091a

jobs:
  project-and-verify:
    name: Project and verify TDE11 Teacher Guide V2.2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ÖğretmenOS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate projector and vendored profile
        run: |
          python3 -m py_compile tool/project_teacher_guide_pedagogy_v2.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(os.environ['V22_PROFILE']).read_text(encoding='utf-8'))
          assert p['architecture_version'] == '2.2.0'
          assert p['source_tymm_commit'] == os.environ['TYMM_V22_COMMIT']
          assert set(p['section_profiles']) == {'TEMA_02', 'TEMA_03', 'TEMA_04'}
          assert set(p['phase_profiles']) == {'opening','manage','meaning','analyze_apply','reflect','assessment'}
          print('V2.2 profile: PASS')
          PY

      - name: Verify canonical runtime precondition
        run: |
          python3 - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          runtime = Path(os.environ['TDE11_RUNTIME'])
          manifest = json.loads((runtime/'runtime_manifest.json').read_text(encoding='utf-8'))
          seal = json.loads((runtime/'teacher_guide_validation_seal.json').read_text(encoding='utf-8'))
          assert manifest['canonical_content_fingerprint'] == os.environ['EXPECTED_CANONICAL_FINGERPRINT']
          if seal.get('projection_version') != '1.2.0+pedagogy-v2.2-profile':
              assert seal['teacher_guide_content_fingerprint'] == os.environ['EXPECTED_BASE_TEACHER_FINGERPRINT']
              assert seal['row_counts']['teacher_guide_units'] == 94
              assert seal['row_counts']['teacher_guide_items'] == 283
              assert seal['row_counts']['teacher_guide_item_relations'] == 3750
          db = sqlite3.connect(runtime/'course_runtime.sqlite')
          try:
              assert db.execute("SELECT COUNT(*) FROM teacher_guide_units WHERE unit_id NOT LIKE '__pedv2_unit__%'").fetchone()[0] == 94
              assert db.execute("SELECT COUNT(*) FROM teacher_guide_items WHERE unit_id NOT LIKE '__pedv2_unit__%'").fetchone()[0] == 283
          finally:
              db.close()
          print('Canonical TDE11 teacher-guide precondition: PASS')
          PY

      - name: Project V2.2 pedagogy onto canonical runtime
        run: |
          python3 tool/project_teacher_guide_pedagogy_v2.py \
            --course-id TDE_11 \
            --runtime-dir "$TDE11_RUNTIME" \
            --profiles "$V22_PROFILE" \
            --package-manifest "$TDE11_PACKAGE" \
            --expected-canonical-fingerprint "$EXPECTED_CANONICAL_FINGERPRINT" \
            --expected-teacher-guide-fingerprint "$EXPECTED_BASE_TEACHER_FINGERPRINT"

      - name: Verify V2.2 projection metadata and row contract
        run: |
          python3 - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          runtime = Path(os.environ['TDE11_RUNTIME'])
          manifest = json.loads((runtime/'runtime_manifest.json').read_text(encoding='utf-8'))
          package = json.loads(Path(os.environ['TDE11_PACKAGE']).read_text(encoding='utf-8'))
          seal = json.loads((runtime/'teacher_guide_validation_seal.json').read_text(encoding='utf-8'))
          meta = manifest['teacher_guide_capabilities']['pedagogy_overlay']
          assert meta['available'] is True
          assert meta['architecture_version'] == '2.2.0'
          assert meta['projection_version'] == '1.2.0+pedagogy-v2.2-profile'
          assert meta['source_tymm_commit'] == os.environ['TYMM_V22_COMMIT']
          assert meta['source_mode'] == 'CANONICAL_RUNTIME_PLUS_V2_PROFILE'
          assert meta['themes'] == ['TEMA_02','TEMA_03','TEMA_04']
          assert meta['sections'] == 21
          assert meta['blocks'] == 69
          assert meta['canonical_task_items_reused'] == 216
          assert manifest['row_counts']['teacher_guide_units'] == 163
          assert manifest['row_counts']['teacher_guide_items'] == 352
          assert manifest['row_counts']['teacher_guide_item_relations'] > 3750
          assert package['teacher_guide_source_commit'] == os.environ['TYMM_V22_COMMIT']
          assert package['teacher_guide_capabilities']['pedagogy_overlay'] == meta
          assert seal['pedagogy_overlay'] == meta
          db = sqlite3.connect(runtime/'course_runtime.sqlite')
          try:
              assert db.execute("SELECT COUNT(*) FROM teacher_guide_units WHERE unit_id LIKE '__pedv2_unit__%'").fetchone()[0] == 69
              assert db.execute("SELECT COUNT(*) FROM teacher_guide_items WHERE item_id LIKE '__pedv2_block__%'").fetchone()[0] == 69
              assert db.execute("PRAGMA foreign_key_check").fetchall() == []
          finally:
              db.close()
          print('TDE11 Teacher Guide V2.2 projection contract: PASS')
          PY

      - name: Set up Dart for runtime verifier
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify runtime with ÖğretmenOS verifier
        working-directory: tool/runtime_verifier
        run: |
          dart pub get
          dart run bin/verify_runtime.dart --course TDE_11

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Run application regression suite
        run: |
          flutter pub get
          flutter test --reporter expanded

      - name: Check generated diff
        run: |
          git diff --check
          git status --short

      - name: Publish V2.2 runtime assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$TDE11_RUNTIME/course_runtime.sqlite" \
            "$TDE11_RUNTIME/runtime_manifest.json" \
            "$TDE11_RUNTIME/teacher_guide_validation_seal.json" \
            "$TDE11_PACKAGE"
          if git diff --cached --quiet; then
            echo 'Teacher Guide V2.2 runtime is already materialized.'
            exit 0
          fi
          git commit -m 'chore(runtime): materialize TDE11 Teacher Guide V2.2 [skip ci]'
          git restore --worktree -- analysis_options.yaml pubspec.lock || true
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
