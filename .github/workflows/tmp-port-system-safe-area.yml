name: TMP Port System Viewport Safe Area

on:
  push:
    branches:
      - fix/system-viewport-safe-area
    paths:
      - '.github/workflows/tmp-port-system-safe-area.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Port safe-area contract onto current app shell
        env:
          SAFE_AREA_TEST_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          app = Path('lib/app/app.dart')
          text = app.read_text(encoding='utf-8')
          old = """    builder: (context, child) =>
              AppFocusDismissRegion(child: child ?? const SizedBox.shrink()),"""
          if old not in text:
              old = """    builder: (context, child) =>
          AppFocusDismissRegion(child: child ?? const SizedBox.shrink()),"""
          new = """    builder: (context, child) => SafeArea(
            key: const ValueKey('app-system-viewport-safe-area'),
            top: false,
            left: true,
            right: true,
            bottom: true,
            maintainBottomViewPadding: true,
            child: AppFocusDismissRegion(
              child: child ?? const SizedBox.shrink(),
            ),
          ),"""
          if old not in text:
              raise SystemExit('Expected current app builder not found; refusing to patch stale code.')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('test/system_viewport_safe_area_test.dart').write_bytes(
              base64.b64decode(os.environ['SAFE_AREA_TEST_B64'])
          )
          PY

      - name: Format
        run: dart format lib/app/app.dart test/system_viewport_safe_area_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Targeted regression
        run: flutter test test/system_viewport_safe_area_test.dart --reporter expanded

      - name: Full regression
        run: flutter test --reporter expanded

      - name: Diff check
        run: git diff --check

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/app.dart test/system_viewport_safe_area_test.dart
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ui): preserve system viewport safe area'
          git push origin HEAD:fix/system-viewport-safe-area
