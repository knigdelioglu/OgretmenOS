name: P4 UI Patch Bootstrap

on:
  push:
    branches:
      - feat/lesson-plan-workflow-p4
    paths:
      - tool/p4_apply_ui_patch.py

permissions:
  contents: write

jobs:
  apply-ui-integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply narrow P4 integration patch
        run: python tool/p4_apply_ui_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patched screens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/this_week/this_week_page.dart lib/features/block/block_detail_page.dart
          git commit -m 'feat(p4): surface lesson plans in teacher workflow'
          git push origin HEAD:"$GITHUB_REF_NAME"
