name: V2.3 Private Source Probe

on:
  push:
    branches: [v23-integration-probe]
    paths: [.github/workflows/v23-private-source-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ÖğretmenOS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate V2.3 export through private TYMM action
        uses: knigdelioglu/tymm/.github/actions/export-v23@teacher-guide-v2.3-book-first
        with:
          output: ${{ runner.temp }}/teacher_guide_v23_runtime_export.json

      - name: Verify generated export is visible to caller
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ runner.temp }}/teacher_guide_v23_runtime_export.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print(data['source_commit'])
          print(data['totals'])
          assert data['source_commit'] == '20860e3165d5e9de18913364286e6f89f28f6046'
          assert data['totals']['entries'] == 573
          PY
