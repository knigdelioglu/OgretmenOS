name: Teacher Guide Turkish Label Migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-teacher-guide-turkish-label-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Apply localization migration
        run: python3 tool/apply_teacher_guide_turkish_labels_fix.py

      - name: Format changed Dart files
        run: dart format lib/features/resources/teacher_guide_viewer_page.dart test/teacher_guide_viewer_test.dart

      - name: Run focused tests
        run: flutter test test/teacher_guide_viewer_test.dart

      - name: Check diff
        run: git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/resources/teacher_guide_viewer_page.dart test/teacher_guide_viewer_test.dart
          git commit -m "fix: localize teacher guide field labels in Turkish"
          git push origin HEAD:main
