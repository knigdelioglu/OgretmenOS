name: TMP5 Teacher Guide Finalize

on:
  push:
    branches:
      - fix/teacher-guide-note-state
    paths:
      - .github/workflows/tmp5-teacher-guide-finalize.yml

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply deterministic fixes
        run: |
          python3 tool/tmp_teacher_guide_note_fix.py
          python3 tool/tmp_teacher_guide_note_lint_fix.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd tool/runtime_verifier && dart pub get)

      - name: Format changed Dart files
        run: dart format lib/features/resources/teacher_guide_viewer_page.dart test/teacher_guide_viewer_test.dart

      - name: Static analysis
        run: |
          flutter analyze
          (cd tool/runtime_verifier && dart analyze)

      - name: Teacher Guide viewer regression tests
        run: flutter test test/teacher_guide_viewer_test.dart --reporter expanded

      - name: Teacher Guide repository and notes tests
        run: |
          flutter test test/teacher_guide_repository_test.dart --reporter expanded
          flutter test test/teacher_guide_notes_repository_test.dart --reporter expanded
          flutter test test/teacher_guide_runtime_verifier_test.dart --reporter expanded
          flutter test test/runtime_manifest_policy_test.dart --reporter expanded
          flutter test test/runtime_sync_atomic_test.dart --reporter expanded

      - name: Full Flutter suite against committed full runtime
        run: flutter test --reporter compact

      - name: Verify committed TDE11 full runtime
        working-directory: tool/runtime_verifier
        run: dart run bin/verify_runtime.dart --course TDE_11

      - name: Verify TDE12-only curriculum rebuild helper
        run: |
          python3 tool/rebuild_curriculum_only_runtimes.py
          (cd tool/runtime_verifier && dart run bin/verify_runtime.dart --course TDE_11)
          (cd tool/runtime_verifier && dart run bin/verify_runtime.dart --course TDE_12)
          git checkout -- tymm-verileri/turk-dili-ve-edebiyati/TDE_12/runtime

      - name: Ensure helper did not mutate TDE11 runtime
        run: git diff --exit-code -- tymm-verileri/turk-dili-ve-edebiyati/TDE_11/runtime

      - name: Diff check
        run: git diff --check

      - name: Commit validated source and clean temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -f \
            .github/workflows/tmp-teacher-guide-note-fix.yml \
            .github/workflows/tmp2-teacher-guide-note-fix.yml \
            .github/workflows/tmp3-teacher-guide-analyze.yml \
            .github/workflows/tmp4-teacher-guide-analyze-artifact.yml \
            .github/workflows/tmp5-teacher-guide-finalize.yml \
            tool/tmp_teacher_guide_note_fix.py \
            tool/tmp_teacher_guide_note_lint_fix.py

          git add \
            lib/features/resources/teacher_guide_viewer_page.dart \
            test/teacher_guide_viewer_test.dart \
            tool/rebuild_curriculum_only_runtimes.py \
            .github/workflows/flutter-ci.yml \
            tymm-verileri/turk-dili-ve-edebiyati/TDE_11/package_manifest.json

          git diff --cached --check
          git status --short
          git commit -m 'fix: preserve teacher guide note identity and runtime CI truth'
          git push origin HEAD:fix/teacher-guide-note-state
