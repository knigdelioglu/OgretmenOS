name: Temporary Android v1.0.1 Publisher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore: publish Android v1.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fixed release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4ad5fd2ba84c945bfc711b4d31a2695b7b3a7355

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create ephemeral release key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ogretmenos-v101-release.jks" \
            -storepass release-password \
            -keypass release-password \
            -alias ogretmenos-v101-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=OgretmenOS v1.0.1 Release, OU=Release, O=OgretmenOS, L=CI, ST=CI, C=TR"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/ogretmenos-v101-release.jks
          storePassword=release-password
          keyAlias=ogretmenos-v101-release
          keyPassword=release-password
          EOF

      - name: Build fixed Android APK
        run: flutter build apk --release --no-pub

      - name: Verify TYMM runtime assets inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          LIST="$RUNNER_TEMP/apk-files.txt"
          unzip -l "$APK" > "$LIST"
          for course in TDE_9 TDE_10 TDE_11 TDE_12; do
            base="assets/flutter_assets/tymm-verileri/turk-dili-ve-edebiyati/$course/runtime"
            grep -F "$base/runtime_manifest.json" "$LIST"
            grep -F "$base/course_runtime.sqlite" "$LIST"
          done

      - name: Publish GitHub Release v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 4ad5fd2ba84c945bfc711b4d31a2695b7b3a7355
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.1"
          APK="OgretmenOS-v1.0.1-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          cat > release-notes.md <<EOF
          # ÖğretmenOS v1.0.1

          Android açılış hotfix'i.

          - TDE 9-12 runtime manifest ve SQLite dosyaları APK içine doğru şekilde paketleniyor.
          - TDE 9 ve 10 tam runtime.
          - TDE 11 ve 12 curriculum-only; ders kitabı bekleniyor uyarısıyla haftalık/yıllık plan kullanılabilir.
          - rootBundle testleri dört sınıfın runtime dosyalarını doğruluyor.
          - CI APK içeriğini doğrudan kontrol ediyor.
          - Kaynak commit: ${TARGET_SHA}
          - APK SHA-256: ${SHA256}

          Not: v1.0.0 ve v1.0.1 mevcut CI düzenindeki geçici Android imzalama anahtarlarıyla üretilmiştir. İmzalar farklı olabileceğinden v1.0.0 kurulu cihazda v1.0.1 için önce eski uygulamayı kaldırmak gerekebilir.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "ÖğretmenOS v1.0.1" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "$APK" \
              --target "$TARGET_SHA" \
              --title "ÖğretmenOS v1.0.1" \
              --notes-file release-notes.md \
              --latest
          fi

          gh release view "$TAG" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name],sizes:[.assets[].size]}'

      - name: Record successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CONTENT=$(printf 'v1.0.1\nOgretmenOS-v1.0.1-android.apk\n4ad5fd2ba84c945bfc711b4d31a2695b7b3a7355\n' | base64 -w0)
          gh api --method PUT repos/${{ github.repository }}/contents/.release-v101-published \
            -f message='chore: record v1.0.1 publication [skip ci]' \
            -f content="$CONTENT"
