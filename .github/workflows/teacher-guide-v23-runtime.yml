name: Teacher Guide V2.3 Runtime

on:
  push:
    branches:
      - teacher-guide-v23-runtime
    paths:
      - 'tool/teacher_guide/v23_source/**'
      - 'tool/audit_teacher_guide_v23_source.py'
      - 'tool/audit_teacher_guide_v23_projection.py'
      - 'tool/project_teacher_guide_v23.py'
      - 'tool/run_teacher_guide_v23_projection.py'
      - 'tool/migrate_teacher_guide_v23_repository_test.py'
      - 'tool/teacher_guide/v23_canonical_overrides.json'
      - 'tool/runtime_verifier/**'
      - '.github/workflows/teacher-guide-v23-runtime.yml'
  pull_request:
    paths:
      - 'tool/teacher_guide/v23_source/**'
      - 'tool/audit_teacher_guide_v23_source.py'
      - 'tool/audit_teacher_guide_v23_projection.py'
      - 'tool/project_teacher_guide_v23.py'
      - 'tool/run_teacher_guide_v23_projection.py'
      - 'tool/migrate_teacher_guide_v23_repository_test.py'
      - 'tool/teacher_guide/v23_canonical_overrides.json'
      - 'tool/runtime_verifier/**'
      - 'test/teacher_guide_repository_test.dart'
      - '.github/workflows/teacher-guide-v23-runtime.yml'

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit vendored V2.3 source
        run: |
          python tool/audit_teacher_guide_v23_source.py \
            --source-root tool/teacher_guide/v23_source \
            --database tymm-verileri/turk-dili-ve-edebiyati/TDE_11/runtime/course_runtime.sqlite \
            --overrides tool/teacher_guide/v23_canonical_overrides.json

  projection-smoke:
    needs: source-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - name: Project V2.3 into an isolated package copy
        run: |
          rm -rf /tmp/tde11-v23-package
          mkdir -p /tmp/tde11-v23-package/runtime
          cp -a tymm-verileri/turk-dili-ve-edebiyati/TDE_11/runtime/. /tmp/tde11-v23-package/runtime/
          cp tymm-verileri/turk-dili-ve-edebiyati/TDE_11/package_manifest.json /tmp/tde11-v23-package/package_manifest.json
          python tool/run_teacher_guide_v23_projection.py \
            --runtime-dir /tmp/tde11-v23-package/runtime \
            --source-root tool/teacher_guide/v23_source \
            --overrides tool/teacher_guide/v23_canonical_overrides.json \
            --package-manifest /tmp/tde11-v23-package/package_manifest.json
      - name: Audit projected V2.3 runtime quality
        run: |
          python tool/audit_teacher_guide_v23_projection.py \
            --runtime-dir /tmp/tde11-v23-package/runtime \
            --package-manifest /tmp/tde11-v23-package/package_manifest.json
      - name: Verify projected package with runtime verifier
        working-directory: tool/runtime_verifier
        run: |
          dart pub get
          dart run bin/verify_runtime.dart \
            --course TDE_11 \
            --package-root /tmp/tde11-v23-package
      - name: Set up Flutter for repository integration test
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Exercise repository adapter against projected V2.3 package
        env:
          TDE11_RUNTIME_PACKAGE_ROOT: /tmp/tde11-v23-package
        run: |
          python tool/migrate_teacher_guide_v23_repository_test.py
          flutter pub get
          flutter test test/teacher_guide_repository_test.dart --reporter expanded
