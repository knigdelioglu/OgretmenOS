name: ogretmen_os
description: "Offline-first TYMM Teacher OS runtime for TDE_9."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/courses/TDE_9/course_runtime.sqlite
    - assets/courses/TDE_9/runtime_manifest.json
    - assets/calendars/
