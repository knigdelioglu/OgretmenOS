    - tymm-verileri/turk-dili-ve-edebiyati/TDE_10/
    - tymm-verileri/turk-dili-ve-edebiyati/TDE_10/runtime/
    - tymm-verileri/turk-dili-ve-edebiyati/TDE_11/
